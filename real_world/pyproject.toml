[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wcx-agilex-control"
version = "0.1.0"
description = "Reusable local observation and motion primitives for a configured Piper platform"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy"]

[project.optional-dependencies]
cameras = ["opencv-python", "pyrealsense2"]

[project.scripts]
agilex-control = "agilex_control.__main__:main"
agilex-dashboard = "agilex_control.dashboard:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agilex_control = ["web/*"]
