name: Reproduce released checkpoints
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu-replay:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - name: Install CPU environment
        run: |
          python -m pip install torch==2.8.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-full.txt
          python -m pip install -e . --no-deps
      - name: Verify model mechanisms and full trajectory outputs
        run: |
          python tools/run_unit_tests.py
          rsi-verify --device cpu --output outputs/verification_cpu.json
          rsi-replay --input examples/episodes/pant_fail_ep000000.npz --expected examples/expected/pant_fail_ep000000.npz --output outputs/pant_fail_ep0
      - name: Check control contracts without API or simulator
        run: |
          python -m pip install pytest jsonschema
          python -m pytest -q tests/test_control_loop.py tests/test_checkpoint_download.py tests/test_provider.py
      - uses: actions/upload-artifact@v4
        with:
          name: replay-and-verification
          path: outputs/
