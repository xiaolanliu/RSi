# Original base controller with a separately generated simulation reference.
# Resource paths live in ignored resources.local.json; no credentials here.
model_provider = "haha"
task = "fold_clothes"
vla_checkpoint_kind = "base"
eval_seed = 0
layout_id = 0
vla_gpu = 0
sim_gpu = 1
vision_device = "cuda:1"
monitor_device = "cpu"
norm_asset = "arx_x5_sim"
# Equivalent two-finger travel: 2 * (0.044 - (-0.010)) m from X5 config.
# This is an estimated stroke mapping, not a measured real/sim aperture match.
gripper_open_width_m = [0.108, 0.108]

[loop]
vla_execute_steps = 10
max_recovery_steps = 25
cooldown_steps = 25
clear_steps_to_rearm = 5
max_interventions = 1
max_steps = 1500
recovery_mode = "live"

[gpt]
enabled = false
model = "" # Select a Responses + vision model supported by this provider.
credential_file = ".env.local"
max_requests = 1
max_output_tokens = 1600
timeout = 90
demo_mp4 = "examples/demonstrations/sim_fold_clothes_02/success.mp4"
# system_prompt_file = "/absolute/path/to/SYSTEM_PROMPT.txt"

[model_providers.haha]
name = "HahaModel"
base_url = "https://hahamodel.com/v1"
wire_api = "responses"
env_key = "HAHA_API_KEY"
requires_openai_auth = false
use_environment_proxy = false

# Optional project-only HTTP CONNECT proxy; global proxy settings are untouched.
# proxy_url = "http://127.0.0.1:YOUR_PORT"
